<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Extension</title>
  <link rel="stylesheet" type="text/css" href="popup.css">
 
</head>
<body>
    
  <header>
    <h1>Slitherator</h1>
  </header>

  <main>
    <div class="card">
      <h2>Debug</h2>
      <p>For internal testing DONT PUT ANYTHING HERE</p>
        <div class="container">
            <input
            type="text"
            id="input"
            class="textbox"
            placeholder="NO NO NO NOTHING HERE"
            />
        </div>
    </div>

     <div class="card">
      <h2>Tunnel</h2>
      <p>Paste the tunnel URL here buddy</p>
        <div class="container">
            <input
            type="text"
            id="tunnel"
            class="textbox"
            placeholder="https://haru-urara.trycloudflare.com"
            value="http://localhost:3000"
            />
        </div>
    </div>

    <button id="confirm">Confirm</button>
  </main>

</body>
 <script src="popup.js"></script>
</html>
